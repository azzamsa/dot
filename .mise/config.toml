[env]
MISE_TASK_MONOREPO_EXCLUDE_DIRS = "utils/mise"

[tools]
stylua = "latest"
"aqua:Kampfkarren/selene" = "latest"
typos = "latest"
dprint = "latest"
actionlint = "latest"
zizmor = "latest"
shellcheck = "latest"
"cargo:nu" = "latest"
"cargo:nu-lint" = "latest"

[tasks.setup]
hide = true
confirm = "⚠️ This command will alter your system. Continue?"
description = "Setup the project"
depends = ["hooks"]

[tasks.audit]
# Extras, deep, thorough checks. Should be run locally.
hide = true
description = "Exhaustive quality check"
depends = ["check", "audit:*"]

[tasks.fix]
# Apply automatic fixes, then check.
# Intended for use before commit or push.
description = "Enforce rules"
depends = ["update-example", "fmt", "check"]

[tasks.check]
# Quality check. Primarily used in CI.
hide = true
description = "Quality check"
depends = "lint"

[tasks.lint]
# Minimal, fast feedback checks.
hide = true
description = "Lint"
depends = "lint:*"
run = [
    # format
    "dprint check",
    "stylua . --allow-hidden --check",
    # lint
    "selene . --quiet",
    # typos
    "typos",
]

[tasks.fmt]
hide = true
description = "Format"
run = ["dprint fmt", "stylua . --allow-hidden"]

[tasks."lint:shell"]
hide = true
description = "Lint shell scripts"
run = "grep -lE '^#!.*\\b(bash|sh)$' bin/* .mise/tasks/* setups/scripts/* | xargs -r shellcheck"

[tasks.publish]
alias = "p"
description = "Publish configs and binaries"
depends = "lint"
run = "dotter deploy"

[tasks.up]
hide = true
description = "Upgrade dependencies"
run = "dprint config update"

[tasks."audit:extras"]
hide = true
interactive = true
description = "Dependency analysis"
run = [
    # Dependencies
    "pnpx actions-up",
    # GitHub CI
    "actionlint",
    "zizmor .github/workflows/*",
]
